name: Build and Push Docker Image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    permissions:
      contents: read
      packages: write
    outputs:
      short-sha: ${{ steps.short-sha.outputs.value }}
      image-owner-lc: ${{ steps.image-owner-lc.outputs.value }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Add SHORT_SHA Environment Variable
        id: short-sha
        shell: bash
        run: echo "value=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: GHCR image owner (lowercase)
        id: image-owner-lc
        shell: bash
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Use github.token (not a custom secret). If push gets 403, grant this repo
      # write access on the package: Packages -> finance-dashboard -> Package settings -> Actions access.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.image-owner-lc.outputs.value }}/finance-dashboard:${{ steps.short-sha.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.HOST_USERNAME }}
          key: ${{ secrets.HOST_SSH_KEY }}
          script_stop: true
          envs: GHCR_PULL_TOKEN
          script: |

            set -euo pipefail

            cd ${{ secrets.SERVER_APP_DIR }}

            SHORT_HASH="${{ needs.build-and-push.outputs.short-sha }}"
            echo "SHORT_HASH: $SHORT_HASH"

            echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u ${{ needs.build-and-push.outputs.image-owner-lc }} --password-stdin

            docker pull ghcr.io/${{ needs.build-and-push.outputs.image-owner-lc }}/finance-dashboard:$SHORT_HASH

            if sed -i "s|COMMIT_ID=.*|COMMIT_ID=$SHORT_HASH|" .env; then
              echo ".env updated successfully with COMMIT_ID=$SHORT_HASH"
            else
              echo "ERROR: Failed to update .env file"
              exit 1
            fi

            echo "Updated .env file:"
            grep "COMMIT_ID=" .env

            echo "Starting containers with new image..."
            make up

            docker images ghcr.io/${{ needs.build-and-push.outputs.image-owner-lc }}/finance-dashboard --format "{{.Repository}}:{{.Tag}}" --filter "dangling=false" | tail -n +4

            echo "Deployment completed successfully!"
